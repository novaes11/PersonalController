name: AI Squad Orchestrator

on:
  workflow_dispatch:
    inputs:
      notion_task_id:
        description: 'ID ou URL da Tarefa do Notion'
        required: true
  pull_request:
    types: [opened, synchronize]

jobs:
  squad:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Notion Task ID
        id: resolve_task
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_TASK_ID: ${{ github.event.inputs.notion_task_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK_ID="$INPUT_TASK_ID"
          else
            # Tenta extrair o ID do Notion (UUID de 32 chars) da descrição do PR de forma segura
            TASK_ID=$(printf '%s' "$PR_BODY" | grep -oE '[a-f0-9]{8}-?[a-f0-9]{4}-?[a-f0-9]{4}-?[a-f0-9]{4}-?[a-f0-9]{12}|[a-f0-9]{32}' | head -n 1 | tr -d '-' || true)
          fi

          if [ -n "$TASK_ID" ]; then
            echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Notion Task ID detectado: $TASK_ID"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "Nenhum Notion Task ID informado no PR. Pulando execucao do Squad."
          fi

      - name: Run AI Agents Core
        if: steps.resolve_task.outputs.found == 'true'
        uses: novaes11/ai-agents-core@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          notion_api_key: ${{ secrets.NOTION_API_KEY }}
          notion_task_id: ${{ steps.resolve_task.outputs.task_id }}
