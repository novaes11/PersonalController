name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify Secret Hygiene
        run: |
          echo "Auditoria de segredos e arquivos sensíveis..."
          if git ls-files | grep -E '\.env$|\.env\.local$'; then
            echo "ERRO: Arquivo .env detectado no repositório!"
            exit 1
          fi
          echo "Nenhum arquivo de ambiente sensível detectado."

      - name: Run tests
        run: npm test
